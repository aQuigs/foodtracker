name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: App JS stays under 100 KB gzipped
        run: |
          size=$(cat dist/assets/*.js | gzip -9 | wc -c)
          echo "app js gzipped: $size bytes"
          test "$size" -lt 102400
