name: USDA releases

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The repo does not let Actions open PRs, and a PR opened with the
      # default GITHUB_TOKEN would trigger no workflows, so no preview.
      - name: Require USDA_PR_TOKEN
        env:
          USDA_PR_TOKEN: ${{ secrets.USDA_PR_TOKEN }}
        run: |
          if [ -z "$USDA_PR_TOKEN" ]; then
            echo "::error::Add a USDA_PR_TOKEN repository secret: a fine-grained token with Contents and Pull requests write on this repo"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.USDA_PR_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run check-usda-releases

      - name: Open a PR for the new releases
        env:
          GH_TOKEN: ${{ secrets.USDA_PR_TOKEN }}
        run: |
          if git diff --quiet scripts/usda-releases.json; then
            echo "No new USDA release."
            exit 0
          fi

          branded=$(jq -r .branded scripts/usda-releases.json)
          foundation=$(jq -r .foundation scripts/usda-releases.json)
          sr_legacy=$(jq -r .srLegacy scripts/usda-releases.json)
          branch="usda-releases/$branded"

          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists on origin; leaving it alone."
            exit 0
          fi

          title="Update USDA data to the branded $branded, foundation $foundation and SR Legacy $sr_legacy releases"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "The PR preview shows the app with its food data rebuilt from these releases."
