repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      # tsconfig files allow comments, and the build hook parses them with tsc
      - id: check-json
        exclude: '(^|/)tsconfig\.json$'
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: check-added-large-files

      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: check-markdown
        name: check-markdown
        entry: markdownlint -c ./.markdownlintrc
        language: system
        types: [markdown]
        exclude: '^specs/|(^|/)CLAUDE\.md$'

      # Any change can break the build or the tests, so these run on every commit; CI leaves them to web_ci
      - id: build
        name: Build (typecheck src and scripts, bundle size)
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: test
        name: Run the browser tests
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
