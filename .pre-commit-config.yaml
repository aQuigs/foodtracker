repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      # Each new catalog version is a newly added file over the size limit
      - id: check-added-large-files
        exclude: '^public/data/'

      # Catalogs end without a newline and their manifests hash their exact bytes
      - id: end-of-file-fixer
        exclude: '^public/data/'
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: check-markdown
        name: check-markdown
        entry: markdownlint -c scripts/markdownlint.yaml
        language: system
        types: [markdown]
        exclude: '^specs/|(^|/)CLAUDE\.md$'

      # Commit-time only: in CI the web_ci workflow runs the build and the tests
      - id: build
        name: Typecheck, build and check the bundle size
        entry: npm run build
        language: system
        pass_filenames: false
        types_or: [ts, javascript, html, css, json]
        stages: [pre-commit]
      - id: test
        name: Run the browser tests
        entry: npm test
        language: system
        pass_filenames: false
        types_or: [ts, javascript, html, css, json]
        stages: [pre-commit]
