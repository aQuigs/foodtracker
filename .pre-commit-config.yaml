# Catalogs are hashed into their manifests, so a hook that rewrites one breaks the hash
exclude: '^public/data/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml

      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: check-markdown
        name: check-markdown
        entry: markdownlint -c scripts/markdownlint.yaml
        language: system
        files: \.(md|mdown|markdown)$
        exclude: '^specs/|(^|/)CLAUDE\.md$'

      # Commit-time only: in CI the web_ci workflow runs the build and the tests
      - id: build
        name: Typecheck, build and check the bundle size
        entry: npm run build
        language: system
        pass_filenames: false
        types_or: [ts, javascript, html, css, json]
        stages: [pre-commit]
      - id: test
        name: Run the browser tests
        entry: npm test
        language: system
        pass_filenames: false
        types_or: [ts, javascript, html, css, json]
        stages: [pre-commit]
