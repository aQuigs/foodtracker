# Shared config: sync-common keeps every repo's copy identical to the original in the tooling checkout; edit the original only.
# Pass it to the linter with -c, markdownlint only auto-loads its own dotfile names.

# Prose is wrapped by the editor, so a hard line limit only creates churn.
line-length: false

# A document may repeat a heading such as "Usage" under different sections.
no-duplicate-heading: false
